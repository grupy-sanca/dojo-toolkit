[project]
name = "dojo-toolkit"
version = "0.8.1"
description = "Toolkit for Python Coding Dojos."
authors = [{name = "grupy-sanca"}]
packages = [{ include = "dojo_toolkit" }]
readme = "README.rst"
requires-python = ">=3.9"

dependencies = [
    "watchdog>=2.1.6,<3.0.0",
    "pyglet>=1.5.21,<2.0.0",
    "clint>=0.5.1,<0.6.0",
    "typer[all]>=0.9.0,<1.0.0",
    "pgi>=0.0.11; sys_platform == 'linux'",
    "desktop-notifier == 6.2.0"
]

[dependency-groups]
dev = [
    "coverage[toml]>=6.1.2,<7.0.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.5",
    "respx>=0.21.1",
    "ruff>=0.8.2",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = [
    "I",  # isort
    "C4",  # flake8-comprehensions
    "F",  # pyflakes
    "E",  # pycodestyle
    "TID",  # flake8-tidy-imports
    "C901",  # mccabe
]
lint.ignore = [
    "C401",  # generator syntax for sets vs always force set comprehension
    "PLC0414",  # allow explicit re-exports using 'as' without forcing __all__
]

[project.scripts]
dojo = "dojo_toolkit.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
